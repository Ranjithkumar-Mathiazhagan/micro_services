name: micro_services_pipeline
on: push

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: checkout the code
        uses: actions/checkout@v3

      - name: install dependencies for python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: install pytest
        run: pip install pytest

      - name: install dependencies for node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: install and test node
        working-directory: ./service_b
        run: |
         npm install
         npm test
          

  build-service-a:
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push service-a
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/service-a:latest ./service_a
          docker push ${{ secrets.DOCKER_USERNAME }}/service-a:latest

  build-service-b:
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push service-b
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/service-b:latest ./service_b
          docker push ${{ secrets.DOCKER_USERNAME }}/service-b:latest
